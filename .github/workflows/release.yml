name: release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          npm view "$PACKAGE" versions --json > versions.json
          if jq -e --arg version "$VERSION" 'if type == "array" then index($version) != null else . == $version end' versions.json > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          if response=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" 2>&1); then
            echo "released=true" >> "$GITHUB_OUTPUT"
          elif [[ "$response" == HTTP/*' 404 '* ]]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "$response"
            exit 1
          fi
          rm versions.json
      - if: steps.existing.outputs.published == 'false' || steps.existing.outputs.released == 'false'
        run: |
          npm test
          npm run check-package
      - if: steps.existing.outputs.published == 'false' || steps.existing.outputs.released == 'false'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md \
            | sed '/./,$!d' > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no section for $VERSION."
            exit 1
          fi
      - if: steps.existing.outputs.published == 'false'
        run: npm publish
      - if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
