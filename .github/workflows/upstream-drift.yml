name: upstream-drift

# The validate workflow only checks the pinned upstream commits. This reports
# what landed upstream after those pins, in one issue that it keeps current.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Upstream drift report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: drift
        run: |
          node scripts/upstream-drift.mjs > drift.md
          cat drift.md
      - id: issue
        run: |
          # Own only an issue this workflow wrote: opened by a bot and carrying the report marker.
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --limit 100 --json number,author,body \
            --jq 'map(select(.author.is_bot and (.body | contains("<!-- mstack-upstream-drift -->")))) | .[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - if: steps.drift.outputs.drift == 'true' && steps.issue.outputs.number == ''
        run: gh issue create --title "$TITLE" --body-file drift.md
      - if: steps.drift.outputs.drift == 'true' && steps.issue.outputs.number != ''
        run: gh issue edit "${{ steps.issue.outputs.number }}" --body-file drift.md
      - if: steps.drift.outputs.drift == 'false' && steps.issue.outputs.number != ''
        run: gh issue close "${{ steps.issue.outputs.number }}" --comment "Both pins are current with the adapted upstream paths."
