name: upstream-drift

# The validate workflow only checks the pinned upstream commits. This reports
# what landed upstream after those pins, in one issue that it keeps current.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Upstream drift report
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - id: drift
        run: |
          node scripts/upstream-drift.mjs > drift.md
          cat drift.md
      - id: issue
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - if: steps.drift.outputs.drift == 'true' && steps.issue.outputs.number == ''
        run: gh issue create --title "$TITLE" --body-file drift.md
      - if: steps.drift.outputs.drift == 'true' && steps.issue.outputs.number != ''
        run: gh issue edit "${{ steps.issue.outputs.number }}" --body-file drift.md
      - if: steps.drift.outputs.drift == 'false' && steps.issue.outputs.number != ''
        run: gh issue close "${{ steps.issue.outputs.number }}" --comment "Both pins are current with the adapted upstream paths."
