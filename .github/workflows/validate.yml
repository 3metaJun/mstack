name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  meta-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: tools/meta-mode
      - run: bun test
        working-directory: tools/meta-mode
      - run: bun run typecheck
        working-directory: tools/meta-mode

  statechart:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: tools/meta-mode
      - run: npm install --ignore-scripts --package-lock=false
        working-directory: skills/statechart/scripts
      - run: node tools/meta-mode/node_modules/typescript/bin/tsc --project skills/statechart/scripts --typeRoots tools/meta-mode/node_modules/@types
      - name: Install pinned TLC
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: npm test
        working-directory: skills/statechart/scripts
      - if: runner.os == 'Windows'
        run: npm run test:portable
        working-directory: skills/statechart/scripts
      - name: Check real TLC CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node skills/statechart/scripts/statechart.ts skills/statechart/scripts/test/corpus/Login/Login.tla --view skills/statechart/scripts/test/corpus/Login/view.mjs --out "$env:RUNNER_TEMP/login-chart"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$env:RUNNER_TEMP/login-chart/chart.mmd") -or !(Test-Path "$env:RUNNER_TEMP/login-chart/report.md")) { throw 'Statechart CLI did not produce the chart and report' }

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cursor/plugins
          ref: 4dd1d05818d19792e7cd6e818f1667f95f7e1dbe
          path: .upstream/cursor-plugins
          sparse-checkout: pstack
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: mattpocock/skills
          ref: 49dd158d1076134a641b33efb035946536778336
          path: .upstream/mattpocock-skills
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: node scripts/check-upstream.mjs --source .upstream/cursor-plugins/pstack --strict
      - run: node scripts/skill-baseline.mjs --check --source .upstream/cursor-plugins/pstack --matt-source .upstream/mattpocock-skills

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm run check-package
